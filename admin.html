<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 관리 | 김빛난</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

<div class="topbar" id="topbar">
  <div class="wrap topbar-inner">
    <a href="index.html" class="logo">김빛난<span>선생님</span></a>
    <nav class="nav" id="nav">
      <a href="about.html" data-page="about">소개</a>
      <a href="services.html" data-page="services">강의</a>
      <a href="reviews.html" data-page="reviews">후기</a>
      <a href="contact.html" data-page="contact">연락처</a>
    </nav>
    <div class="nav-cta-group">
      <a href="contact.html" class="btn btn-primary btn-sm">상담 신청</a>
      <button type="button" class="btn btn-outline btn-sm" id="preRegisterBtn">사전 등록</button>
    </div>
    <button class="hamburger" id="hamburger" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
  </div>
</div>

<div class="mobile-nav" id="mobileNav">
  <a href="about.html" data-page="about">소개</a>
  <a href="services.html" data-page="services">강의</a>
  <a href="reviews.html" data-page="reviews">후기</a>
  <a href="contact.html" data-page="contact">연락처</a>
</div>

<main>
  <section class="section section-first" id="admin">
    <div class="wrap">
      <p class="section-eyebrow">ADMIN</p>
      <h2 class="section-title">문의 관리</h2>

      <div id="authGate" class="admin-login">
        <form id="loginForm" novalidate>
          <div class="form-row">
            <label for="loginEmail">이메일</label>
            <input type="email" id="loginEmail" name="loginEmail" placeholder="name@email.com">
          </div>
          <div class="form-row">
            <label for="loginPassword">비밀번호</label>
            <input type="password" id="loginPassword" name="loginPassword" placeholder="비밀번호">
          </div>
          <button type="submit" class="btn btn-primary btn-block">로그인</button>
          <p class="form-note" id="loginNote"></p>
        </form>
      </div>

      <div id="adminPanel" class="admin-panel" hidden>
        <div class="admin-panel-head">
          <p class="section-sub" id="inquiryCount"></p>
          <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">로그아웃</button>
        </div>
        <div id="inquiryList" class="inquiry-list"></div>

        <div class="admin-section">
          <h3 class="admin-section-title">사전 등록 관리</h3>
          <p class="section-sub" id="preregCount"></p>
          <div id="preregList" class="prereg-list"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© 2026 김빛난. All rights reserved.</span>
    <span class="footer-note">이 페이지는 예시 콘텐츠로 제작되었습니다.</span>
  </div>
</footer>

<div class="modal-overlay" id="preRegisterOverlay" hidden>
  <div class="modal-card">
    <button type="button" class="modal-close" id="preRegisterClose" aria-label="닫기">&times;</button>
    <h3>사전 등록</h3>
    <p class="modal-sub">이름과 희망 날짜를 입력해 주세요.</p>
    <form id="preRegisterForm" novalidate>
      <div class="form-row">
        <label for="preRegName">이름 <em>*</em></label>
        <input type="text" id="preRegName" name="preRegName" placeholder="홍길동">
        <span class="error-msg" id="err-preRegName"></span>
      </div>
      <div class="form-row">
        <label for="preRegDate">날짜 <em>*</em></label>
        <input type="date" id="preRegDate" name="preRegDate">
        <span class="error-msg" id="err-preRegDate"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-block">등록하기</button>
      <p class="form-note" id="preRegNote"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
<script src="admin.js"></script>
</body>
</html>
